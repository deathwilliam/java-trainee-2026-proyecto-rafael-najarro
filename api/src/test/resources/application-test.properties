# Base exclusiva para pruebas. Debe existir antes de ejecutar Maven.
spring.datasource.url=jdbc:postgresql://localhost:5433/sipas_test
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
# Un fallo de import.sql debe detener el arranque del contexto de pruebas.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

# Clave pública de ejemplo, exclusiva para pruebas.
jwt.clave=clave-exclusiva-para-pruebas-sipas-2026-no-produccion
